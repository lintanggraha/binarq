name: binarq
description: "Aplikasi kuis edukasi islami interaktif untuk SDIT"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.1.0
  go_router: ^13.2.0
  lottie: ^3.1.0
  audioplayers: ^5.2.1
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  path_provider: ^2.1.1
  supabase: ^2.10.6
  supabase_flutter: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6
  isar_generator: ^3.1.0
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - bank_soal.json
    - assets/audio/calm_quiz_loop.wav
    - assets/audio/answer_correct.wav
    - assets/audio/answer_wrong.wav
